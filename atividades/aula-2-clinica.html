<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínica de diagnóstico — Aula 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  :root {
    --roxo:#402C4F; --roxo-deep:#2C1E37; --azul:#455066; --azul-tint:rgba(69,80,102,0.09);
    --fundo:#FCFCFA; --fundo-alt:#F2EFEA; --amarelo:#EFB93C; --amarelo-ink:#5B4212;
    --texto:#2A2432; --muted:#6b6478; --border:rgba(64,44,79,0.16); --ok:#2f8f5f; --erro:#b0475a;
    --fam-c:#455066; --fam-o:#B9861A; --fam-m:#402C4F;
    --display:'Fraunces', Georgia, serif; --body:'Inter', -apple-system, sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  html, body { overflow-x:hidden; max-width:100%; }
  body { margin:0; font-family:var(--body); background:var(--fundo); color:var(--texto); line-height:1.6; }
  .page, .hero-inner, .abas-inner { max-width:var(--vd-largura, 1200px); margin:0 auto; padding:0 1.5rem; }
  .page { padding-bottom:6rem; }
  h2, h3, h4 { font-family:var(--display); color:var(--roxo); line-height:1.2; }
  p { margin:0 0 0.9rem; }

  /* hero */
  header.hero { background:var(--roxo); color:#fff; padding:clamp(1.8rem,5vw,2.8rem) 0 clamp(1.5rem,4vw,2.2rem); position:relative; overflow:hidden; }
  header.hero::before { content:''; position:absolute; right:-120px; top:-150px; width:420px; height:420px; border-radius:50%; border:2px solid rgba(239,185,60,0.2); }
  .hero-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:2rem; align-items:end; position:relative; z-index:1; }
  .hero .tag { display:inline-flex; align-items:center; gap:0.5rem; border:1px solid rgba(239,185,60,0.5); color:var(--amarelo); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; padding:0.32rem 0.9rem; border-radius:100px; font-weight:600; }
  .hero .tag i { width:8px; height:8px; border-radius:50%; background:var(--amarelo); }
  .hero h1 { font-family:var(--display); font-weight:700; font-size:clamp(2rem,5vw,3.1rem); margin:0.8rem 0 0.45rem; line-height:1.05; color:#fff; }
  .hero h1 em { color:var(--amarelo); font-weight:500; }
  .hero-sub { font-family:var(--display); font-style:italic; color:rgba(255,255,255,0.82); max-width:62ch; margin:0; font-size:1.02rem; }
  .hero label { font-size:0.68rem; letter-spacing:0.09em; text-transform:uppercase; color:rgba(255,255,255,0.65); display:block; margin-bottom:0.3rem; font-weight:600; }
  .hero input[type="text"] { background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.28); border-radius:8px; padding:0.65rem 0.8rem; color:#fff; font-family:var(--body); font-size:16px; width:100%; }
  .hero input::placeholder { color:rgba(255,255,255,0.42); }

  /* abas */
  .abas { position:sticky; top:58px; z-index:300; background:var(--fundo); border-bottom:1px solid var(--border); box-shadow:0 10px 24px -22px rgba(44,30,55,0.6); }
  .abas-inner { display:flex; gap:0.35rem; overflow-x:auto; scrollbar-width:thin; padding-top:0.6rem; padding-bottom:0.6rem; }
  .aba { flex-shrink:0; display:inline-flex; align-items:center; gap:0.55rem; background:transparent; border:1px solid transparent; border-radius:100px; padding:0.45rem 0.95rem 0.45rem 0.5rem; font-family:var(--body); font-weight:600; font-size:0.86rem; color:var(--azul); cursor:pointer; white-space:nowrap; }
  .aba:hover { background:var(--fundo-alt); }
  .aba[aria-selected="true"] { background:var(--roxo); color:#fff; }
  .aba-n { width:1.6rem; height:1.6rem; border-radius:50%; background:var(--fundo-alt); color:var(--roxo); display:inline-flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:0.85rem; }
  .aba[aria-selected="true"] .aba-n { background:var(--amarelo); color:var(--amarelo-ink); }
  .aba-badge { font-size:0.68rem; font-weight:700; padding:0.1rem 0.45rem; border-radius:100px; background:rgba(47,143,95,0.14); color:#1f6a45; }
  .aba[aria-selected="true"] .aba-badge { background:rgba(255,255,255,0.18); color:#bff0d6; }
  .painel { display:none; padding-top:2rem; }
  .painel.ativo { display:block; }

  /* texto */
  .eyebrow { display:flex; align-items:center; gap:0.55rem; font-size:0.74rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--amarelo-ink); margin-bottom:0.5rem; }
  .eyebrow i { width:8px; height:8px; border-radius:50%; border:2px solid var(--amarelo); }
  h2.tit { font-size:clamp(1.55rem,3.3vw,2rem); margin:0 0 0.7rem; display:flex; align-items:baseline; gap:0.7rem; flex-wrap:wrap; }
  h3.sub { font-size:1.2rem; margin:2rem 0 0.8rem; }
  .cod { font-family:var(--body); font-size:0.72rem; font-weight:700; letter-spacing:0.06em; color:var(--amarelo-ink); background:rgba(239,185,60,0.2); border-radius:6px; padding:0.2rem 0.5rem; position:relative; top:-0.2em; }
  .lead { font-size:1rem; color:var(--azul); line-height:1.75; max-width:88ch; }
  .lead p:last-child { margin-bottom:0; }
  .lead strong, .texto strong { color:var(--roxo); }
  .texto { color:var(--azul); font-size:0.94rem; line-height:1.7; }
  .ajuda { font-size:0.84rem; color:var(--muted); margin:0.2rem 0 0.7rem; }
  .vazio { color:var(--muted); font-style:italic; font-size:0.9rem; }
  .bloco { background:#fff; border:1px solid var(--border); border-radius:18px; padding:1.3rem 1.4rem; margin-bottom:1.1rem; }
  .bloco h3 { margin:0 0 0.6rem; font-size:1.15rem; }
  .instr { display:flex; gap:0.9rem; align-items:flex-start; background:var(--roxo-deep); color:rgba(255,255,255,0.85); border-radius:14px; padding:0.9rem 1.15rem; margin-bottom:1.1rem; font-size:0.93rem; line-height:1.6; }
  .instr .n { width:1.9rem; height:1.9rem; border-radius:50%; background:var(--amarelo); color:var(--amarelo-ink); font-family:var(--display); font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .instr strong { color:var(--amarelo); }
  .instr p { margin:0; }
  .acoes { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:1rem; }

  /* grades */
  .grade { display:grid; gap:0.9rem; }
  .g4 { grid-template-columns:repeat(4, minmax(0,1fr)); }
  .g3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
  .g2 { grid-template-columns:repeat(2, minmax(0,1fr)); }

  /* como funciona */
  .rodada-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:0.4rem; cursor:pointer; text-align:left; font:inherit; color:inherit; transition:border-color .2s, transform .2s; }
  .rodada-card:hover { border-color:var(--roxo); transform:translateY(-2px); }
  .rc-topo { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; }
  .rc-nome { font-family:var(--display); font-weight:600; font-size:1.06rem; color:var(--roxo); }
  .rc-nome strong { font-weight:600; }
  .rc-tempo { font-size:0.72rem; font-weight:700; color:var(--amarelo-ink); background:rgba(239,185,60,0.2); border-radius:100px; padding:0.12rem 0.55rem; white-space:nowrap; }
  .rc-txt { font-size:0.87rem; color:var(--azul); }
  .rc-entrega { margin-top:auto; font-size:0.8rem; color:var(--texto); border-top:1px dashed var(--border); padding-top:0.5rem; }
  .rc-entrega b { display:block; font-size:0.64rem; letter-spacing:0.09em; text-transform:uppercase; color:var(--ok); }
  .papel { background:#fff; border:1px solid var(--border); border-radius:18px; padding:1.1rem 1.15rem; display:flex; flex-direction:column; gap:0.55rem; }
  .papel-cab { display:flex; align-items:center; gap:0.7rem; }
  .papel-ico { width:44px; height:44px; border-radius:12px; background:var(--roxo); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
  .papel-nome { font-family:var(--display); font-weight:700; font-size:1.15rem; color:var(--roxo); line-height:1.1; }
  .papel-quando { display:block; font-family:var(--body); font-size:0.7rem; font-weight:600; color:var(--muted); letter-spacing:0.03em; }
  .papel ul { margin:0; padding-left:1.1rem; font-size:0.88rem; color:var(--azul); line-height:1.55; }
  .papel ul li { margin-bottom:0.25rem; }
  .papel ul li::marker { color:var(--amarelo); }
  .papel-frase { font-family:var(--display); font-style:italic; color:var(--roxo); background:rgba(239,185,60,0.14); border-radius:10px; padding:0.45rem 0.7rem; font-size:0.95rem; }
  .papel-quem { margin-top:auto; }
  .papel-quem label { font-size:0.66rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:0.25rem; }
  .troca { margin-top:0.8rem; font-size:0.88rem; color:var(--azul); display:flex; gap:0.5rem; align-items:center; }
  .regra { background:#fff; border:1px solid var(--border); border-radius:14px; padding:0.9rem 1rem; display:flex; gap:0.75rem; font-size:0.88rem; color:var(--azul); line-height:1.55; }
  .regra-n { width:1.9rem; height:1.9rem; border-radius:50%; flex-shrink:0; background:var(--amarelo); color:var(--amarelo-ink); font-family:var(--display); font-weight:700; display:flex; align-items:center; justify-content:center; }
  .regra strong { color:var(--roxo); }

  /* siglas e chips */
  .sigla { display:inline-block; font-weight:700; font-size:0.72rem; letter-spacing:0.04em; padding:0.06rem 0.4rem; border-radius:5px; border:1px solid; line-height:1.4; white-space:nowrap; }
  .s-c { background:rgba(69,80,102,0.12); color:#2E3646; border-color:rgba(69,80,102,0.45); }
  .s-o { background:rgba(239,185,60,0.22); color:var(--amarelo-ink); border-color:rgba(185,134,26,0.55); }
  .s-m { background:rgba(64,44,79,0.11); color:var(--roxo); border-color:rgba(64,44,79,0.4); }
  .s-f { background:rgba(47,143,95,0.13); color:#1f6a45; border-color:rgba(47,143,95,0.45); }
  .s-l { background:rgba(107,100,120,0.12); color:#4d4759; border-color:rgba(107,100,120,0.4); }
  .s-r { background:transparent; color:#6b6478; border-color:rgba(107,100,120,0.45); border-style:dashed; }
  .chips { display:flex; flex-wrap:wrap; gap:0.35rem; }
  .chip { font-family:var(--body); font-size:0.82rem; font-weight:600; border:1px solid var(--border); background:#fff; color:var(--azul); border-radius:8px; padding:0.4rem 0.7rem; cursor:pointer; min-height:38px; line-height:1.2; }
  .chip:hover { border-color:var(--roxo); }
  .chip:focus-visible { outline:2px solid var(--amarelo); outline-offset:2px; }
  .chip:disabled { opacity:0.45; cursor:not-allowed; }
  .chip.on { background:var(--roxo); border-color:var(--roxo); color:#fff; }
  .chip.sig.c.on { background:var(--fam-c); border-color:var(--fam-c); }
  .chip.sig.o.on { background:var(--fam-o); border-color:var(--fam-o); }
  .chip.sig.m.on { background:var(--fam-m); border-color:var(--fam-m); }
  .chip.sig.f.on { background:var(--ok); border-color:var(--ok); }
  .chip.sig.l.on, .chip.sig.r.on { background:#6b6478; border-color:#6b6478; }
  .chip-sep { width:1px; background:var(--border); margin:0 0.2rem; }
  .rot { display:block; font-size:0.68rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--muted); margin:0.9rem 0 0.35rem; }
  .rot b { color:var(--roxo); }

  /* campos */
  input[type="text"], textarea, select { width:100%; border:1px solid var(--border); border-radius:8px; padding:0.6rem 0.7rem; font-family:var(--body); font-size:15px; color:var(--texto); background:var(--fundo-alt); line-height:1.5; }
  textarea { min-height:80px; resize:vertical; overflow:hidden; }
  select { min-height:42px; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--amarelo); outline-offset:1px; }
  .campo { margin-bottom:0.8rem; }
  .campo label { display:block; font-size:0.74rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--azul); margin-bottom:0.3rem; }
  .campos-2 { display:grid; grid-template-columns:1fr 1fr; gap:0 1rem; }
  .campos-4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:0 1rem; }

  /* tabelas */
  .tab-wrap { border:1px solid var(--border); border-radius:14px; overflow:hidden; background:#fff; margin:0.8rem 0 1.2rem; }
  table.tab { width:100%; border-collapse:collapse; font-size:0.86rem; }
  table.tab th { background:var(--azul); color:#fff; text-align:left; font-size:0.7rem; letter-spacing:0.05em; text-transform:uppercase; padding:0.65rem 0.8rem; font-weight:700; }
  table.tab td { padding:0.65rem 0.8rem; border-top:1px solid var(--border); color:var(--azul); vertical-align:top; line-height:1.55; }
  table.tab td:first-child { color:var(--roxo); font-weight:600; }
  table.tab td strong { color:var(--roxo); }
  table.tab tbody tr:nth-child(even) td { background:rgba(239,238,231,0.45); }
  table.tab select { font-size:14px; min-height:38px; }
  @media (max-width:760px) {
    .tab-wrap { border:none; background:transparent; overflow:visible; }
    table.tab thead { display:none; }
    table.tab, table.tab tbody, table.tab tr, table.tab td { display:block; width:100%; }
    table.tab tr { background:#fff; border:1px solid var(--border); border-radius:12px; padding:0.5rem 0.9rem; margin-bottom:0.7rem; }
    table.tab tbody tr:nth-child(even) td { background:transparent; }
    table.tab td { border-top:none; padding:0.35rem 0; }
    table.tab td[data-label]:not([data-label=""])::before { content:attr(data-label); display:block; font-size:0.64rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--amarelo-ink); }
  }

  /* Rodada 1 */
  .tracker { display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center; background:var(--fundo-alt); border-radius:12px; padding:0.6rem 0.8rem; margin:1rem 0 1.2rem; font-size:0.82rem; color:var(--azul); }
  .tracker .sigla { opacity:0.35; }
  .tracker .sigla.usada { opacity:1; }
  .tracker .sigla.repetida { box-shadow:0 0 0 2px var(--erro); opacity:1; }
  .tracker .aviso { color:var(--erro); font-weight:600; }
  .caso { background:#fff; border:1px solid var(--border); border-radius:18px; padding:1.1rem 1.2rem; display:flex; flex-direction:column; }
  .caso.feito { border-color:rgba(64,44,79,0.4); }
  .caso-cab { display:flex; align-items:baseline; gap:0.6rem; margin-bottom:0.4rem; }
  .caso-n { font-family:var(--display); font-weight:700; font-size:1.5rem; color:var(--amarelo); line-height:1; }
  .caso-comp { font-family:var(--display); font-style:italic; color:var(--roxo); font-size:1.02rem; line-height:1.35; }
  .caso-txt { font-size:0.9rem; color:var(--azul); line-height:1.65; flex:1; }
  .caso textarea { min-height:60px; }

  /* Rodada 2 */
  .dossie-barra { display:flex; justify-content:space-between; align-items:center; gap:0.8rem 1.4rem; flex-wrap:wrap; background:#fff; border:1px solid var(--border); border-radius:16px; padding:0.9rem 1.1rem; margin:1rem 0 1.1rem; }
  .dossie-atual .dn { display:block; font-size:0.68rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--amarelo-ink); }
  .dossie-atual .dt { font-family:var(--display); font-weight:600; font-size:1.2rem; color:var(--roxo); }
  .dossie-outros { display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap; font-size:0.78rem; color:var(--muted); }
  .dossie-bt { font:inherit; font-size:0.8rem; font-weight:600; color:var(--azul); background:var(--fundo-alt); border:1px solid var(--border); border-radius:100px; padding:0.3rem 0.75rem; cursor:pointer; }
  .dossie-bt.on { background:var(--roxo); border-color:var(--roxo); color:#fff; }
  .passos-nav { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)) auto; gap:0.4rem; margin:0 0 1.2rem; }
  .passo-nav { display:flex; align-items:center; gap:0.55rem; font:inherit; font-size:0.86rem; font-weight:600; color:var(--azul); background:var(--fundo-alt); border:1px solid var(--border); border-radius:12px; padding:0.55rem 0.75rem; cursor:pointer; text-align:left; }
  .passo-nav .pn { width:1.6rem; height:1.6rem; border-radius:50%; background:#fff; color:var(--roxo); display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:0.78rem; border:1px solid var(--border); flex-shrink:0; }
  .passo-nav.on { background:var(--roxo); border-color:var(--roxo); color:#fff; }
  .passo-nav.on .pn { background:var(--amarelo); color:var(--amarelo-ink); border-color:var(--amarelo); }
  .passo-nav.feito .pn { background:var(--ok); color:#fff; border-color:var(--ok); }
  .etapa-painel { display:none; }
  .etapa-painel.ativo { display:block; }
  .cab-dossie { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:0.6rem; margin:0.9rem 0 1.2rem; }
  .cd-item { background:#fff; border:1px solid var(--border); border-radius:12px; padding:0.7rem 0.9rem; font-size:0.92rem; }
  .cd-item .cd-rot { display:block; font-size:0.66rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--amarelo-ink); margin-bottom:0.15rem; }
  .cd-item.cd-cru { grid-column:1 / -1; background:var(--fundo-alt); font-family:var(--display); font-style:italic; color:var(--roxo); }
  .passos-lista { display:flex; flex-direction:column; gap:0.45rem; }
  .passo-bt { display:flex; align-items:center; gap:0.8rem; text-align:left; font:inherit; font-size:0.94rem; color:var(--texto); background:#fff; border:1px solid var(--border); border-radius:12px; padding:0.65rem 0.9rem; cursor:pointer; }
  .passo-bt:hover { border-color:var(--roxo); }
  .passo-bt .pn { width:1.8rem; height:1.8rem; border-radius:50%; background:var(--roxo); color:#fff; font-family:var(--display); font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .passo-bt .pq { margin-left:auto; width:2rem; height:2rem; border-radius:50%; border:2px dashed var(--border); color:transparent; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .passo-bt.on { border-color:var(--amarelo); background:rgba(239,185,60,0.12); }
  .passo-bt.on .pq { border-style:solid; border-color:var(--amarelo); background:var(--amarelo); color:var(--amarelo-ink); }

  /* mural em faixas */
  .contador { display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap; margin:0 0 0.8rem; }
  .contador .pontos { display:flex; gap:4px; }
  .contador .pontos i { width:22px; height:8px; border-radius:4px; background:var(--fundo-alt); border:1px solid var(--border); }
  .contador .pontos i.on { background:var(--roxo); border-color:var(--roxo); }
  .contador b { font-family:var(--display); color:var(--roxo); font-size:1.05rem; }
  .mural { display:flex; flex-direction:column; gap:0.45rem; margin-bottom:1.6rem; }
  .faixa { display:grid; grid-template-columns:250px 1fr; gap:0.8rem; align-items:stretch; background:var(--fundo-alt); border:1px solid var(--border); border-radius:14px; padding:0.6rem; }
  .faixa.palpite { border:2px solid var(--amarelo); background:rgba(239,185,60,0.09); }
  .faixa.especial { background:#fff; border-style:dashed; }
  .faixa-cab { display:flex; gap:0.6rem; align-items:flex-start; font-size:0.84rem; color:var(--azul); line-height:1.4; padding:0.2rem; }
  .faixa-cab .fn { width:1.7rem; height:1.7rem; border-radius:50%; background:var(--roxo); color:#fff; font-family:var(--display); font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.85rem; }
  .faixa-cab .q { display:inline-flex; width:1.25rem; height:1.25rem; border-radius:50%; background:var(--amarelo); color:var(--amarelo-ink); font-weight:700; font-size:0.75rem; align-items:center; justify-content:center; margin-left:0.3rem; }

  return `<button type="button" class="chip${fam}${opts.cls ? ' ' + opts.cls : ''}" data-c="${path}" data-v="${esc(val)}"${title} aria-pressed="false">${label}</button>`;
}
function chipsSiglas(path, extras) {

}
function campo(path, rotulo, opts = {}) {
  const id = 'f_' + path.replace(/[^\w]/g, '_');

    ? `<textarea id="${id}" data-b="${path}" placeholder="${esc(opts.ph || '')}"></textarea>`
    : `<input type="text" id="${id}" data-b="${path}" placeholder="${esc(opts.ph || '')}">`;
  return `<div class="campo"><label for="${id}">${rotulo}</label>${ctl}</div>`;
}
function select(path, opcoes, vazio, rotulo) {
  return `<select data-b="${path}" aria-label="${esc(rotulo || vazio || '')}"><option value="">${esc(vazio || '—')}</option>` +

}

async function abrirGabarito(chave) {
  const X = window.CLINICA_GABARITO;
  if (!X || !chave || !window.crypto || !crypto.subtle) return false;
  try {
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(chave.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(X.sal), iterations: X.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(X.iv) }, k, b(X.dados));
    G = JSON.parse(new TextDecoder().decode(pt));
    return true;
  } catch (e) { return false; }
}

function comparar(n, id) {
  const g = gabCarta(n, id); if (!g) return null;
  const s = ((S.m[n] || {}).cartas || {})[id] || {};
  const k = lugar(s);

  return { g, s, k, passo, barreira, alt, degrau: !!s.degrau && s.degrau === g.degrau, ponto: !!k && g.sobe && barreira, noMural: !!k };
}

function resumo(d) {

  add('Grupo', 'Nome do grupo', d.grupo);

  add('Grupo', 'Papéis', PAPEIS.filter(x => p[x.k]).map(x => x.nome + ': ' + p[x.k]).join(' · '));

  C.r2.dossies.forEach(dd => {

    if (ds.palpite) add(sec, 'Palpite (passo em que mais se perde)', 'Passo ' + ds.palpite + ': ' + txt(dd.passos[Number(ds.palpite) - 1] || ''));
    dd.cartas.forEach(c => { const s = cs[c.id]; const k = lugar(s); if (!k) return;
      add(sec, 'Carta ' + c.id, ['passo ' + k, s.b1 ? '● ' + s.b1 : '', s.b2 ? '○ ' + s.b2 : '', s.degrau ? DEGRAU_NOME[s.degrau] : '', s.porque || '', s.decide ? 'decidiria: ' + s.decide : ''].filter(Boolean).join(' · ')); });
    const dec = ds.dec || {};
    Object.keys(dec).forEach(s => { if (dec[s] && dec[s].decisao && SIG[s]) add(sec, 'Decisão: ' + s, { principal: 'Principal', secundaria: 'Secundária', verificar: 'A verificar' }[dec[s].decisao]); });
    add(sec, 'Palpite × dados', ds.palpiteTxt);
    if (ds.hip && Object.values(ds.hip).some(x => x)) add(sec, 'Hipótese', fraseHipotese(ds.hip, false));
    add(sec, 'Próximo dado', proxTexto(ds.prox));
  });
  const r3 = d.r3 || {};
  [['recebida', 'Hipótese que recebemos'], ['contesta', 'Nossa contestação'], ['mudou', 'O que mudou na nossa hipótese'],
   ['carta', 'Carta que enfraquece'], ['troca', 'Marcação que trocaríamos e teste'], ['derruba', 'Dado que derrubaria'], ['critica', 'O que apontaram na nossa'], ['ajuste', 'Ajuste ou evidência'], ['fechamento', 'Frase do fechamento']]
    .forEach(([k, n]) => add('Rodada 3 · Contestação', n, r3[k]));
  const r4 = d.r4 || {};
  add('Rodada 4 · Seu desafio', 'Comportamento como estava', r4.cru);
  add('Rodada 4 · Seu desafio', 'Testes que já passam', TESTES_A01.filter((t, i) => (r4.testes || {})['t' + i] === 'ok').join(', '));
  add('Rodada 4 · Seu desafio', 'Comportamento reescrito', ['quem', 'faz', 'contexto', 'medida'].map((k, i) => r4[k] ? ['Quem', 'Faz o quê', 'Em que contexto', 'O que se mede'][i] + ': ' + r4[k] : '').filter(Boolean).join(' | '));
  (r4.passos || []).forEach((x, i) => {
    if (!x || !x.trim()) return;
    const o = (r4.obs || {})[i];
    add('Rodada 4 · Seu desafio', 'Passo ' + (i + 1) + (String(i + 1) === r4.perde ? ' (?)' : ''), x.trim() + (o && o.trim() ? ' — observamos: ' + o.trim() : ''));
  });

  return L;
}
