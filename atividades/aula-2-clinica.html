<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínica de diagnóstico — Aula 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  :root {
    --roxo:#402C4F; --roxo-deep:#2C1E37; --roxo-tint:rgba(64,44,79,0.06); --azul:#455066; --azul-tint:rgba(69,80,102,0.09);
    --fundo:#FCFCFA; --fundo-alt:#F2EFEA; --papel-dim:#EFEEE7; --amarelo:#EFB93C; --amarelo-ink:#5B4212;
    --texto:#2A2432; --muted:#6b6478; --branco:#fff; --border:rgba(64,44,79,0.16); --ok:#2f8f5f; --erro:#b0475a;
    --fam-c:#455066; --fam-o:#B9861A; --fam-m:#402C4F;
    --display:'Fraunces', Georgia, serif; --body:'Inter', -apple-system, sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  html, body { overflow-x:hidden; max-width:100%; }
  body { margin:0; font-family:var(--body); background:var(--fundo); color:var(--texto); line-height:1.6; }
  .page, .hero-inner, .abas-inner { max-width:var(--vd-largura, 1200px); margin:0 auto; padding:0 1.5rem; }
  .page { padding-bottom:6rem; }
  h2, h3, h4 { font-family:var(--display); color:var(--roxo); line-height:1.2; }
  p { margin:0 0 0.9rem; }
  strong { color:inherit; }

  /* hero */
  header.hero { background:var(--roxo); color:#fff; padding:clamp(2rem,6vw,3.2rem) 0 clamp(1.6rem,4vw,2.4rem); position:relative; overflow:hidden; }
  header.hero::before { content:''; position:absolute; right:-120px; top:-150px; width:420px; height:420px; border-radius:50%; border:2px solid rgba(239,185,60,0.2); }
  .hero .tag { display:inline-flex; align-items:center; gap:0.5rem; border:1px solid rgba(239,185,60,0.5); color:var(--amarelo); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; padding:0.32rem 0.9rem; border-radius:100px; font-weight:600; }
  .hero .tag i { width:8px; height:8px; border-radius:50%; background:var(--amarelo); }
  .hero h1 { font-family:var(--display); font-weight:700; font-size:clamp(2rem,5vw,3.2rem); margin:0.9rem 0 0.5rem; line-height:1.05; color:#fff; }
  .hero h1 em { color:var(--amarelo); font-weight:500; }
  .hero-sub { font-family:var(--display); font-style:italic; color:rgba(255,255,255,0.82); max-width:70ch; margin:0; font-size:1.05rem; }
  .identifica { display:grid; grid-template-columns:1.2fr repeat(4, 1fr); gap:0.8rem; margin-top:1.6rem; position:relative; z-index:1; }
  .identifica label { font-size:0.68rem; letter-spacing:0.09em; text-transform:uppercase; color:rgba(255,255,255,0.65); display:block; margin-bottom:0.3rem; font-weight:600; }
  .identifica input[type="text"] { background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.28); border-radius:8px; padding:0.6rem 0.75rem; color:#fff; font-family:var(--body); font-size:15px; width:100%; }
  .identifica input::placeholder { color:rgba(255,255,255,0.42); }
  .identifica input:focus { outline:2px solid var(--amarelo); outline-offset:1px; }

  /* abas */
  .abas { position:sticky; top:58px; z-index:300; background:var(--fundo); border-bottom:1px solid var(--border); box-shadow:0 10px 24px -22px rgba(44,30,55,0.6); }
  .abas-inner { display:flex; gap:0.35rem; overflow-x:auto; scrollbar-width:thin; padding-top:0.6rem; padding-bottom:0.6rem; }
  .aba { flex-shrink:0; display:inline-flex; align-items:center; gap:0.55rem; background:transparent; border:1px solid transparent; border-radius:100px; padding:0.45rem 0.95rem 0.45rem 0.5rem; font-family:var(--body); font-weight:600; font-size:0.86rem; color:var(--azul); cursor:pointer; white-space:nowrap; }
  .aba:hover { background:var(--fundo-alt); }
  .aba[aria-selected="true"] { background:var(--roxo); color:#fff; }
  .aba-n { width:1.6rem; height:1.6rem; border-radius:50%; background:var(--fundo-alt); color:var(--roxo); display:inline-flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:0.85rem; }
  .aba[aria-selected="true"] .aba-n { background:var(--amarelo); color:var(--amarelo-ink); }
  .aba-badge { font-size:0.68rem; font-weight:700; padding:0.1rem 0.45rem; border-radius:100px; background:rgba(47,143,95,0.14); color:#1f6a45; }
  .aba[aria-selected="true"] .aba-badge { background:rgba(255,255,255,0.18); color:#bff0d6; }
  .aba-gab .aba-n { background:rgba(239,185,60,0.25); }
  .painel { display:none; padding-top:2rem; }
  .painel.ativo { display:block; }

  /* blocos de texto */
  .eyebrow { display:flex; align-items:center; gap:0.55rem; font-size:0.74rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--amarelo-ink); margin-bottom:0.5rem; }
  .eyebrow i { width:8px; height:8px; border-radius:50%; border:2px solid var(--amarelo); }
  h2.tit { font-size:clamp(1.6rem,3.4vw,2.1rem); margin:0 0 0.8rem; display:flex; align-items:baseline; gap:0.7rem; flex-wrap:wrap; }
  .cod { font-family:var(--body); font-size:0.72rem; font-weight:700; letter-spacing:0.06em; color:var(--amarelo-ink); background:rgba(239,185,60,0.2); border-radius:6px; padding:0.2rem 0.5rem; position:relative; top:-0.2em; }
  .legenda-rodadas { display:flex; gap:0.4rem; flex-wrap:wrap; font-size:0.7rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin:1.2rem 0 0.5rem; }
  .ficha-cab { display:grid; grid-template-columns:230px 1fr; gap:1rem; font-size:0.68rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); padding-bottom:0.3rem; border-bottom:2px solid var(--border); margin-top:0.8rem; }
  .lead { font-size:1rem; color:var(--azul); line-height:1.75; max-width:90ch; }
  .lead p:last-child { margin-bottom:0; }
  .texto { color:var(--azul); font-size:0.95rem; line-height:1.75; }
  .texto strong, .lead strong { color:var(--roxo); }
  ol.num { list-style:none; padding:0; margin:0 0 1rem; counter-reset:n; }
  ol.num li { counter-increment:n; position:relative; padding-left:2.4rem; margin-bottom:0.65rem; color:var(--azul); font-size:0.95rem; line-height:1.7; }
  ol.num li::before { content:counter(n); position:absolute; left:0; top:0.05rem; width:1.7rem; height:1.7rem; border-radius:50%; background:var(--roxo); color:#fff; font-family:var(--display); font-weight:700; font-size:0.82rem; display:flex; align-items:center; justify-content:center; }
  ol.num li strong { color:var(--roxo); }
  blockquote.citacao { margin:1.2rem 0; background:#fff; border:1px solid var(--border); border-left:4px solid var(--amarelo); border-radius:0 12px 12px 0; padding:0.9rem 1.2rem; }
  blockquote.citacao p { margin:0; font-family:var(--display); color:var(--roxo); font-size:1.02rem; }
  .bloco { background:#fff; border:1px solid var(--border); border-radius:18px; padding:1.4rem 1.5rem; margin-bottom:1.2rem; }
  .bloco h3 { margin:0 0 0.7rem; font-size:1.2rem; }
  details.sobre { background:var(--fundo-alt); border:1px solid var(--border); border-radius:14px; margin-bottom:1.4rem; }
  details.sobre summary { cursor:pointer; padding:0.85rem 1.1rem; font-weight:600; color:var(--roxo); font-size:0.92rem; list-style:none; display:flex; justify-content:space-between; gap:1rem; }
  details.sobre summary::-webkit-details-marker { display:none; }
  details.sobre summary::after { content:'+'; font-weight:700; }
  details.sobre[open] summary::after { content:'–'; }
  details.sobre .sobre-corpo { padding:0 1.1rem 0.9rem; }

  /* tabelas */
  .tab-wrap { border:1px solid var(--border); border-radius:14px; overflow:hidden; background:#fff; margin:0.8rem 0 1.2rem; }
  table.tab { width:100%; border-collapse:collapse; font-size:0.86rem; }
  table.tab th { background:var(--azul); color:#fff; text-align:left; font-size:0.7rem; letter-spacing:0.05em; text-transform:uppercase; padding:0.65rem 0.8rem; font-weight:700; }
  table.tab td { padding:0.65rem 0.8rem; border-top:1px solid var(--border); color:var(--azul); vertical-align:top; line-height:1.55; }
  table.tab td:first-child { color:var(--roxo); font-weight:600; }
  table.tab td strong { color:var(--roxo); }
  table.tab tbody tr:nth-child(even) td { background:rgba(239,238,231,0.45); }
  @media (max-width:760px) {
    .tab-wrap { border:none; background:transparent; overflow:visible; }
    table.tab thead { display:none; }
    table.tab, table.tab tbody, table.tab tr, table.tab td { display:block; width:100%; }
    table.tab tr { background:#fff; border:1px solid var(--border); border-radius:12px; padding:0.5rem 0.9rem; margin-bottom:0.7rem; }
    table.tab tbody tr:nth-child(even) td { background:transparent; }
    table.tab td { border-top:none; padding:0.35rem 0; }
    table.tab td[data-label]:not([data-label=""])::before { content:attr(data-label); display:block; font-size:0.64rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--amarelo-ink); }
  }

  /* cartões da visão geral */
  .grade { display:grid; gap:0.9rem; }
  .g4 { grid-template-columns:repeat(4, minmax(0,1fr)); }
  .g3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
  .g2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .rodada-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:1.1rem 1.15rem; display:flex; flex-direction:column; gap:0.45rem; cursor:pointer; text-align:left; font:inherit; color:inherit; transition:border-color .2s, transform .2s; }
  .rodada-card:hover { border-color:var(--roxo); transform:translateY(-2px); }
  .rodada-card .rc-nome { font-family:var(--display); font-weight:600; font-size:1.08rem; color:var(--roxo); }
  .rodada-card .rc-nome strong { font-weight:600; }
  .rodada-card .rc-txt { font-size:0.88rem; color:var(--azul); flex:1; }
  .rodada-card .rc-tempo { align-self:flex-start; font-size:0.74rem; font-weight:700; color:var(--amarelo-ink); background:rgba(239,185,60,0.2); border-radius:100px; padding:0.15rem 0.6rem; }
  .regra { background:#fff; border:1px solid var(--border); border-radius:14px; padding:1rem 1.05rem; display:flex; gap:0.8rem; font-size:0.9rem; color:var(--azul); line-height:1.6; }
  .regra-n { width:2rem; height:2rem; border-radius:50%; flex-shrink:0; background:var(--amarelo); color:var(--amarelo-ink); font-family:var(--display); font-weight:700; display:flex; align-items:center; justify-content:center; }
  .regra strong { color:var(--roxo); }
  .papeis { background:var(--roxo-deep); color:rgba(255,255,255,0.82); border-radius:16px; padding:1.2rem 1.4rem; margin-top:1rem; font-size:0.92rem; line-height:1.7; }
  .papeis p { margin:0; }
  .papeis strong { color:var(--amarelo); }
  .links-uteis { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:1rem; }

  /* siglas e chips */
  .sigla { display:inline-block; font-weight:700; font-size:0.74rem; letter-spacing:0.04em; padding:0.08rem 0.42rem; border-radius:5px; border:1px solid; line-height:1.4; white-space:nowrap; }
  .s-c { background:rgba(69,80,102,0.12); color:#2E3646; border-color:rgba(69,80,102,0.45); }
  .s-o { background:rgba(239,185,60,0.22); color:var(--amarelo-ink); border-color:rgba(185,134,26,0.55); }
  .s-m { background:rgba(64,44,79,0.11); color:var(--roxo); border-color:rgba(64,44,79,0.4); }
  .s-f { background:rgba(47,143,95,0.13); color:#1f6a45; border-color:rgba(47,143,95,0.45); }
  .s-l { background:rgba(107,100,120,0.12); color:#4d4759; border-color:rgba(107,100,120,0.4); }
  .s-r { background:transparent; color:#6b6478; border-color:rgba(107,100,120,0.45); border-style:dashed; }
  .chips { display:flex; flex-wrap:wrap; gap:0.35rem; }
  .chip { font-family:var(--body); font-size:0.8rem; font-weight:600; border:1px solid var(--border); background:#fff; color:var(--azul); border-radius:8px; padding:0.38rem 0.65rem; cursor:pointer; min-height:36px; line-height:1.2; transition:background .12s, border-color .12s, color .12s; }
  .chip:hover { border-color:var(--roxo); }
  .chip:focus-visible { outline:2px solid var(--amarelo); outline-offset:2px; }
  .chip.on { background:var(--roxo); border-color:var(--roxo); color:#fff; }
  .chip.sig.c.on { background:var(--fam-c); border-color:var(--fam-c); }
  .chip.sig.o.on { background:var(--fam-o); border-color:var(--fam-o); }
  .chip.sig.m.on { background:var(--fam-m); border-color:var(--fam-m); }
  .chip.sig.f.on { background:var(--ok); border-color:var(--ok); }
  .chip.sig.l.on, .chip.sig.r.on { background:#6b6478; border-color:#6b6478; }
  .chip-sep { width:1px; background:var(--border); margin:0 0.2rem; }
  .ctrl-rot { display:block; font-size:0.66rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--muted); margin:0.8rem 0 0.35rem; }
  .ctrl-rot b { color:var(--roxo); }

  /* campos */
  input[type="text"], textarea, select { width:100%; border:1px solid var(--border); border-radius:8px; padding:0.6rem 0.7rem; font-family:var(--body); font-size:15px; color:var(--texto); background:var(--fundo-alt); line-height:1.5; }
  textarea { min-height:84px; resize:vertical; overflow:hidden; }
  select { min-height:42px; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--amarelo); outline-offset:1px; }
  .campo { margin-bottom:0.8rem; }
  .campo label { display:block; font-size:0.74rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--azul); margin-bottom:0.3rem; }
  .campos-2 { display:grid; grid-template-columns:1fr 1fr; gap:0 1rem; }
  .campos-4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:0 1rem; }
  .ajuda { font-size:0.82rem; color:var(--muted); font-style:italic; margin:0.2rem 0 0.6rem; }

  /* Rodada 1 */
  .tracker { display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center; background:var(--fundo-alt); border-radius:12px; padding:0.6rem 0.8rem; margin:1rem 0 1.2rem; font-size:0.82rem; color:var(--azul); }
  .tracker .sigla { opacity:0.35; }
  .tracker .sigla.usada { opacity:1; }
  .tracker .sigla.repetida { box-shadow:0 0 0 2px var(--erro); opacity:1; }
  .tracker .aviso { color:var(--erro); font-weight:600; }
  .caso { background:#fff; border:1px solid var(--border); border-radius:18px; padding:1.15rem 1.2rem; display:flex; flex-direction:column; }
  .caso.feito { border-color:rgba(64,44,79,0.4); }
  .caso-cab { display:flex; align-items:baseline; gap:0.6rem; margin-bottom:0.4rem; }
  .caso-n { font-family:var(--display); font-weight:700; font-size:1.5rem; color:var(--amarelo); line-height:1; }
  .caso-comp { font-family:var(--display); font-style:italic; color:var(--roxo); font-size:1.02rem; line-height:1.35; }
  .caso-txt { font-size:0.9rem; color:var(--azul); line-height:1.65; flex:1; }
  .caso textarea { min-height:64px; }

  /* Rodada 2 */
  .dossies { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:0.8rem; margin:1rem 0 1.4rem; }
  .dossie-bt { text-align:left; font:inherit; color:inherit; cursor:pointer; background:#fff; border:2px solid var(--border); border-radius:16px; padding:1rem 1.05rem; display:flex; flex-direction:column; gap:0.35rem; transition:border-color .2s, transform .2s; }
  .dossie-bt:hover { border-color:var(--roxo); transform:translateY(-2px); }
  .dossie-bt.on { border-color:var(--roxo); background:var(--roxo); color:#fff; }
  .dossie-bt .dn { font-size:0.7rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--amarelo-ink); }
  .dossie-bt.on .dn { color:var(--amarelo); }
  .dossie-bt .dt { font-family:var(--display); font-weight:600; font-size:1.05rem; line-height:1.25; }
  .dossie-bt .dp { font-size:0.78rem; color:var(--muted); }
  .dossie-bt.on .dp { color:rgba(255,255,255,0.7); }
  .dossie-bt .dprog { font-size:0.74rem; font-weight:600; color:var(--ok); }
  .dossie-bt.on .dprog { color:#9fe4c0; }
  .etapas-nav { display:flex; gap:0.3rem; flex-wrap:wrap; margin:0 0 1.2rem; padding:0.4rem; background:var(--fundo-alt); border-radius:14px; }
  .etapa-bt { display:inline-flex; align-items:center; gap:0.45rem; font:inherit; font-size:0.82rem; font-weight:600; color:var(--azul); background:transparent; border:none; border-radius:10px; padding:0.45rem 0.75rem 0.45rem 0.4rem; cursor:pointer; }
  .etapa-bt:hover { background:#fff; }
  .etapa-bt .en { width:1.5rem; height:1.5rem; border-radius:50%; background:#fff; color:var(--roxo); display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:0.75rem; border:1px solid var(--border); }
  .etapa-bt.on { background:var(--roxo); color:#fff; }
  .etapa-bt.on .en { background:var(--amarelo); color:var(--amarelo-ink); border-color:var(--amarelo); }
  .etapa-bt.feita .en { background:var(--ok); color:#fff; border-color:var(--ok); }
  .etapa-txt { background:var(--roxo-deep); color:rgba(255,255,255,0.82); border-radius:14px; padding:0.95rem 1.2rem; margin-bottom:1.1rem; font-size:0.92rem; line-height:1.65; display:flex; gap:0.9rem; align-items:flex-start; }
  .etapa-txt .en { width:1.9rem; height:1.9rem; border-radius:50%; background:var(--amarelo); color:var(--amarelo-ink); font-family:var(--display); font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .etapa-txt strong { color:var(--amarelo); }
  .etapa-txt p { margin:0; }
  .etapa-painel { display:none; }
  .etapa-painel.ativo { display:block; }
  .cabecalho-dossie { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0.6rem; margin:0.8rem 0 1rem; }
  .cd-item { background:#fff; border:1px solid var(--border); border-radius:12px; padding:0.7rem 0.9rem; font-size:0.92rem; color:var(--texto); }
  .cd-item .cd-rot { display:block; font-size:0.66rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--amarelo-ink); margin-bottom:0.15rem; }
  .cd-item.cd-cru { grid-column:1 / -1; background:var(--fundo-alt); font-family:var(--display); font-style:italic; color:var(--roxo); }
  .passos-lista { display:flex; flex-direction:column; gap:0.5rem; margin:0.8rem 0; }
  .passo-bt { display:flex; align-items:center; gap:0.8rem; text-align:left; font:inherit; font-size:0.94rem; color:var(--texto); background:#fff; border:1px solid var(--border); border-radius:12px; padding:0.7rem 0.9rem; cursor:pointer; }
  .passo-bt:hover { border-color:var(--roxo); }
  .passo-bt .pn { width:1.8rem; height:1.8rem; border-radius:50%; background:var(--roxo); color:#fff; font-family:var(--display); font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .passo-bt .pq { margin-left:auto; width:2rem; height:2rem; border-radius:50%; border:2px dashed var(--border); color:transparent; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .passo-bt.on { border-color:var(--amarelo); background:rgba(239,185,60,0.12); }
  .passo-bt.on .pq { border-style:solid; border-color:var(--amarelo); background:var(--amarelo); color:var(--amarelo-ink); }

  /* mural */
  .mural-wrap { margin:0 0 1.3rem; }
  .mural { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(118px, 1fr); gap:0.45rem; overflow-x:auto; padding-bottom:0.4rem; }
  .mcol { background:var(--fundo-alt); border:1px solid var(--border); border-radius:12px; padding:0.55rem; min-height:130px; display:flex; flex-direction:column; gap:0.35rem; }
  .mcol.palpite { border:2px solid var(--amarelo); background:rgba(239,185,60,0.1); }
  .mcol.especial { background:#fff; border-style:dashed; }
  .mcol-cab { font-size:0.72rem; color:var(--azul); line-height:1.35; padding-bottom:0.35rem; border-bottom:1px dashed var(--border); margin-bottom:0.15rem; }
  .mcol-cab b { display:flex; align-items:center; gap:0.35rem; font-family:var(--display); color:var(--roxo); font-size:0.9rem; }

let S = novoEstado();
function get(p) { return p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), S); }
function set(p, v) {
  const ks = p.split('.'); let o = S;
  ks.slice(0, -1).forEach(k => { if (o[k] == null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; });

}

/* ---------------- componentes de interface ---------------- */
function chip(path, val, label, opts = {}) {
  const fam = TODAS[val] ? ' sig ' + TODAS[val].fam : '';
  const title = TODAS[val] ? ` title="${esc(TODAS[val].nome)}"` : '';
  return `<button type="button" class="chip${fam}${opts.cls ? ' ' + opts.cls : ''}" data-c="${path}" data-v="${esc(val)}" data-m="${opts.multi ? 'multi' : 'um'}"${title} aria-pressed="false">${label}</button>`;
}
function chipsSiglas(path, incluir) {
  const base = Object.keys(SIG).map(s => chip(path, s, s));
  const extra = (incluir || []).map(s => chip(path, s, s));
  return '<div class="chips">' + base.join('') + (extra.length ? '<span class="chip-sep"></span>' + extra.join('') : '') + '</div>';
}
function campo(path, rotulo, opts = {}) {
  const id = 'f_' + path.replace(/[^\w]/g, '_');
  const ctl = opts.area
    ? `<textarea id="${id}" data-b="${path}" placeholder="${esc(opts.ph || '')}"></textarea>`
    : `<input type="text" id="${id}" data-b="${path}" placeholder="${esc(opts.ph || '')}">`;
  return `<div class="campo"><label for="${id}">${rotulo}</label>${ctl}</div>`;
}
function select(path, opcoes, rotuloVazio) {
  return `<select data-b="${path}" aria-label="${esc(rotuloVazio || '')}"><option value="">${esc(rotuloVazio || '—')}</option>` +
    opcoes.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('') + '</select>';
}

const gabDossie = () => Number(S.dossie) || 1;
async function abrirGabarito(chave) {
  const X = window.CLINICA_GABARITO;
  if (!X || !chave || !window.crypto || !crypto.subtle) return false;
  try {
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(chave.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(X.sal), iterations: X.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(X.iv) }, k, b(X.dados));
    G = JSON.parse(new TextDecoder().decode(pt));
    return true;
  } catch (e) { return false; }
}

function comparar(n, id) {

}
